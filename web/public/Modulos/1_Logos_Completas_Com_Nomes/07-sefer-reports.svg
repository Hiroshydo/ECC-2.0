<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="100%" height="100%">
  <defs>
    <!-- Main Squircle Background Gradient -->
    <linearGradient id="bgGrad_sefer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="35%" stop-color="#0D9488" />
      <stop offset="70%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Diagonal Glossy Facet Top-Left -->
    <linearGradient id="glossTL_sefer" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.0" />
    </linearGradient>

    <!-- Diagonal Deep Shadow Bottom-Right -->
    <linearGradient id="SombraBR_sefer" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#021716" stop-opacity="0.55" />
    </linearGradient>

    <!-- Inner Bevel Border Gradient -->
    <linearGradient id="rimGrad_sefer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Mint-Emerald Gradient for Icon Highlights -->
    <linearGradient id="mintGrad_sefer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Dark Emerald Core Fill -->
    <linearGradient id="darkCore_sefer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Crisp Metallic White Gradient -->
    <linearGradient id="whiteGrad_sefer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Soft Drop Shadow for Squircle Badge -->
    <filter id="badgeShadow_sefer" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#042F2E" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>

    <!-- Crisp Inner Icon Drop Shadow -->
    <filter id="iconShadow_sefer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#021716" flood-opacity="0.45" />
    </filter>

    <!-- Clip Path for Squircle Facets -->
    <clipPath id="squircleClip_sefer">
      <rect x="150" y="50" width="500" height="500" rx="115" />
    </clipPath>
  </defs>
  <!-- Squircle Base with 3D Facets & Gloss -->
  <g filter="url(#badgeShadow_sefer)">
    <rect x="150" y="50" width="500" height="500" rx="115" fill="url(#bgGrad_sefer)" />
  </g>
  <g clip-path="url(#squircleClip_sefer)">
    <!-- Top-Left Sweeping Light Facet (Ecclesia Signature Style) -->
    <path d="M 120 50 L 520 50 C 440 220 280 380 120 460 Z" fill="url(#glossTL_sefer)" />
    <!-- Secondary Geometric Facet -->
    <path d="M 150 50 L 650 50 L 650 220 C 480 240 310 350 150 550 Z" fill="#2DD4BF" fill-opacity="0.08" />
    <!-- Bottom-Right Deep Contrast Curve -->
    <path d="M 650 180 C 520 340 380 460 180 550 L 650 550 Z" fill="url(#SombraBR_sefer)" />
  </g>
  <!-- Outer & Inner Precision Bevel Borders -->
  <rect x="153" y="53" width="494" height="494" rx="112" fill="none" stroke="url(#rimGrad_sefer)" stroke-width="5" />
  <rect x="166" y="66" width="468" height="468" rx="102" fill="none" stroke="#99F6E4" stroke-width="1.5" stroke-opacity="0.25" />
  <g transform="translate(400, 290)" filter="url(#iconShadow_sefer)">
    <!-- Outer Book Cover / Back Spine -->
    <path d="M -172 -125 L -150 -125 L -150 118 C -95 118 -45 128 0 148 C 45 128 95 118 150 118 L 150 -125 L 172 -125 L 172 138 C 110 138 52 148 0 172 C -52 148 -110 138 -172 138 Z" fill="#CBD5E1" />

    <!-- Open Book Left Page -->
    <path d="M 0 -128 C -45 -148 -105 -152 -152 -135 L -152 112 C -105 95 -45 102 0 125 Z" fill="url(#whiteGrad_sefer)" stroke="#042F2E" stroke-width="6" stroke-linejoin="round" />

    <!-- Open Book Right Page -->
    <path d="M 0 -128 C 45 -148 105 -152 152 -135 L 152 112 C 105 95 45 102 0 125 Z" fill="url(#whiteGrad_sefer)" stroke="#042F2E" stroke-width="6" stroke-linejoin="round" />

    <!-- Center Book Spine Line -->
    <line x1="0" y1="-128" x2="0" y2="125" stroke="#065F46" stroke-width="8" stroke-linecap="round" />

    <!-- LEFT PAGE: Financial Line Chart & Accounting Grid (ITG 2002) -->
    <!-- Chart Axes -->
    <polyline points="-128,-105 -128,-25 -25,-25" fill="none" stroke="#042F2E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rising Line Graph -->
    <polyline points="-122,-42 -95,-78 -68,-55 -35,-95" fill="none" stroke="#0D9488" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-95" cy="-78" r="7" fill="#042F2E" />
    <circle cx="-68" cy="-55" r="7" fill="#042F2E" />
    <circle cx="-35" cy="-95" r="8" fill="#10B981" />

    <!-- Balance Sheet Table (4x3 Grid) -->
    <g transform="translate(-128, -5)">
      <rect x="0" y="0" width="102" height="76" rx="4" fill="#E2E8F0" stroke="#065F46" stroke-width="5" />
      <!-- Header Row -->
      <rect x="0" y="0" width="102" height="19" fill="#0D9488" />
      <!-- Horizontal Grid Lines -->
      <line x1="0" y1="38" x2="102" y2="38" stroke="#065F46" stroke-width="4" />
      <line x1="0" y1="57" x2="102" y2="57" stroke="#065F46" stroke-width="4" />
      <!-- Vertical Grid Lines -->
      <line x1="25" y1="0" x2="25" y2="76" stroke="#065F46" stroke-width="4" />
      <line x1="51" y1="0" x2="51" y2="76" stroke="#065F46" stroke-width="4" />
      <line x1="76" y1="0" x2="76" y2="76" stroke="#065F46" stroke-width="4" />
    </g>

    <!-- RIGHT PAGE: Executive Bar Chart, Trend Arrow & Donut/Pie Chart -->
    <!-- Bar Chart Base Line -->
    <line x1="22" y1="-22" x2="128" y2="-22" stroke="#042F2E" stroke-width="6" stroke-linecap="round" />
    <!-- 3 Ascending Bars -->
    <rect x="30" y="-52" width="20" height="30" rx="2" fill="#0D9488" />
    <rect x="62" y="-76" width="20" height="54" rx="2" fill="#065F46" />
    <rect x="94" y="-102" width="20" height="80" rx="2" fill="#042F2E" />
    <!-- Upward Trend Arrow -->
    <polyline points="26,-68 52,-95 72,-78 112,-125" fill="none" stroke="#10B981" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="122,-135 96,-128 116,-108" fill="#10B981" />

    <!-- Executive Pie Chart (Bottom Right) -->
    <g transform="translate(72, 42)">
      <!-- Main Pie Circle (3/4 Segment) -->
      <path d="M -4 4 L -4 -36 A 40 40 0 1 0 36 4 Z" fill="#042F2E" />
      <!-- Exploded Top-Right Pie Wedge -->
      <path d="M 4 -4 L 4 -42 A 38 38 0 0 1 38 -15 Z" fill="#0D9488" />
      <!-- Exploded Right Pie Wedge -->
      <path d="M 6 2 L 40 -8 A 38 38 0 0 1 42 12 Z" fill="#2DD4BF" />
    </g>
  </g>
  <!-- Official Module Typography -->
  <g>
    <text x="400" y="645" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#0B3B35" letter-spacing="3">SEFER</text>
    <text x="400" y="693" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#115E59" letter-spacing="7">REPORTS</text>
    <line x1="220" y1="721" x2="580" y2="721" stroke="#0D9488" stroke-width="2" stroke-opacity="0.4" />
    <text x="400" y="751" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#0F766E" letter-spacing="4">LIVRO DE CONTAS E RELATÓRIOS EXECUTIVOS</text>
  </g>
</svg>