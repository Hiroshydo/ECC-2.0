<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 20 580 580" width="100%" height="100%">
  <defs>
    <!-- Main Squircle Background Gradient -->
    <linearGradient id="bgGrad_hiram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="35%" stop-color="#0D9488" />
      <stop offset="70%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Diagonal Glossy Facet Top-Left -->
    <linearGradient id="glossTL_hiram" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.0" />
    </linearGradient>

    <!-- Diagonal Deep Shadow Bottom-Right -->
    <linearGradient id="SombraBR_hiram" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#021716" stop-opacity="0.55" />
    </linearGradient>

    <!-- Inner Bevel Border Gradient -->
    <linearGradient id="rimGrad_hiram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Mint-Emerald Gradient for Icon Highlights -->
    <linearGradient id="mintGrad_hiram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Dark Emerald Core Fill -->
    <linearGradient id="darkCore_hiram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Crisp Metallic White Gradient -->
    <linearGradient id="whiteGrad_hiram" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Soft Drop Shadow for Squircle Badge -->
    <filter id="badgeShadow_hiram" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#042F2E" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>

    <!-- Crisp Inner Icon Drop Shadow -->
    <filter id="iconShadow_hiram" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#021716" flood-opacity="0.45" />
    </filter>

    <!-- Clip Path for Squircle Facets -->
    <clipPath id="squircleClip_hiram">
      <rect x="150" y="50" width="500" height="500" rx="115" />
    </clipPath>
  </defs>
  <!-- Squircle Base with 3D Facets & Gloss -->
  <g filter="url(#badgeShadow_hiram)">
    <rect x="150" y="50" width="500" height="500" rx="115" fill="url(#bgGrad_hiram)" />
  </g>
  <g clip-path="url(#squircleClip_hiram)">
    <!-- Top-Left Sweeping Light Facet (Ecclesia Signature Style) -->
    <path d="M 120 50 L 520 50 C 440 220 280 380 120 460 Z" fill="url(#glossTL_hiram)" />
    <!-- Secondary Geometric Facet -->
    <path d="M 150 50 L 650 50 L 650 220 C 480 240 310 350 150 550 Z" fill="#2DD4BF" fill-opacity="0.08" />
    <!-- Bottom-Right Deep Contrast Curve -->
    <path d="M 650 180 C 520 340 380 460 180 550 L 650 550 Z" fill="url(#SombraBR_hiram)" />
  </g>
  <!-- Outer & Inner Precision Bevel Borders -->
  <rect x="153" y="53" width="494" height="494" rx="112" fill="none" stroke="url(#rimGrad_hiram)" stroke-width="5" />
  <rect x="166" y="66" width="468" height="468" rx="102" fill="none" stroke="#99F6E4" stroke-width="1.5" stroke-opacity="0.25" />
  <g transform="translate(400, 300) scale(1.04) translate(-400, -280)">
  <g transform="translate(400, 248)" filter="url(#iconShadow_hiram)">
    <!-- Left Architectural Globe / Meridian Arcs -->
    <path d="M 0 -138 A 138 138 0 0 0 0 138" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
    <path d="M 0 -138 C -75 -100 -75 100 0 138" fill="none" stroke="#99F6E4" stroke-width="6" stroke-opacity="0.85" />
    <line x1="-138" y1="-22" x2="-25" y2="-22" stroke="#99F6E4" stroke-width="6" stroke-opacity="0.85" />
    <line x1="-125" y1="48" x2="-35" y2="48" stroke="#99F6E4" stroke-width="6" stroke-opacity="0.85" />

    <!-- Right Multi-Tenant Blueprint Grid & Hierarchy Nodes -->
    <g stroke="#99F6E4" stroke-width="5" stroke-linecap="round" opacity="0.9">
      <!-- Vertical Grid Lines -->
      <line x1="58" y1="-115" x2="58" y2="95" />
      <line x1="112" y1="-115" x2="112" y2="95" />
      <!-- Horizontal Grid Lines -->
      <line x1="25" y1="-88" x2="135" y2="-88" />
      <line x1="38" y1="-12" x2="135" y2="-12" />
      <line x1="52" y1="68" x2="135" y2="68" />
      <!-- Blueprint Crosshair / Node Dots -->
      <circle cx="58" cy="-88" r="7" fill="#FFFFFF" stroke="none" />
      <circle cx="112" cy="-88" r="7" fill="#2DD4BF" stroke="none" />
      <circle cx="58" cy="-12" r="7" fill="#2DD4BF" stroke="none" />
      <circle cx="112" cy="-12" r="7" fill="#FFFFFF" stroke="none" />
      <circle cx="112" cy="68" r="7" fill="#FFFFFF" stroke="none" />
    </g>

    <!-- Bottom Measurement Arc -->
    <path d="M -82 112 C -35 142 35 142 82 112" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
    <line x1="0" y1="25" x2="0" y2="145" stroke="#99F6E4" stroke-width="5" stroke-dasharray="10,6" />

    <!-- Center Drafting Compass (Compasso do Arquiteto) -->
    <!-- Top Handle Peg -->
    <rect x="-8" y="-152" width="16" height="32" rx="6" fill="#FFFFFF" />
    <!-- Left Compass Leg -->
    <path d="M -12 -72 L -68 95 L -78 135 L -48 102 L 4 -62 Z" fill="url(#whiteGrad_hiram)" />
    <!-- Right Compass Leg -->
    <path d="M 12 -72 L 68 95 L 78 135 L 48 102 L -4 -62 Z" fill="#CBD5E1" />
    <!-- Horizontal A-Frame Crossbar with Adjustment Wheel -->
    <rect x="-48" y="22" width="96" height="12" rx="6" fill="#FFFFFF" />
    <rect x="-12" y="14" width="24" height="28" rx="5" fill="#2DD4BF" stroke="#FFFFFF" stroke-width="3" />
    <!-- Compass Hinge Head (Circle) -->
    <circle cx="0" cy="-82" r="28" fill="url(#darkCore_hiram)" stroke="#FFFFFF" stroke-width="12" />
    <circle cx="0" cy="-82" r="9" fill="#2DD4BF" />
  </g>
  </g>
</svg>