<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 20 580 580" width="100%" height="100%">
  <defs>
    <!-- Main Squircle Background Gradient -->
    <linearGradient id="bgGrad_khatam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="35%" stop-color="#0D9488" />
      <stop offset="70%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Diagonal Glossy Facet Top-Left -->
    <linearGradient id="glossTL_khatam" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.0" />
    </linearGradient>

    <!-- Diagonal Deep Shadow Bottom-Right -->
    <linearGradient id="SombraBR_khatam" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#021716" stop-opacity="0.55" />
    </linearGradient>

    <!-- Inner Bevel Border Gradient -->
    <linearGradient id="rimGrad_khatam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Mint-Emerald Gradient for Icon Highlights -->
    <linearGradient id="mintGrad_khatam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Dark Emerald Core Fill -->
    <linearGradient id="darkCore_khatam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Crisp Metallic White Gradient -->
    <linearGradient id="whiteGrad_khatam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Soft Drop Shadow for Squircle Badge -->
    <filter id="badgeShadow_khatam" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#042F2E" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>

    <!-- Crisp Inner Icon Drop Shadow -->
    <filter id="iconShadow_khatam" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#021716" flood-opacity="0.45" />
    </filter>

    <!-- Clip Path for Squircle Facets -->
    <clipPath id="squircleClip_khatam">
      <rect x="150" y="50" width="500" height="500" rx="115" />
    </clipPath>
  </defs>
  <defs>
    <filter id="iconShadow_internal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#021716" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Squircle Base with 3D Facets & Gloss -->
  <g filter="url(#badgeShadow_khatam)">
    <rect x="150" y="50" width="500" height="500" rx="115" fill="url(#bgGrad_khatam)" />
  </g>
  <g clip-path="url(#squircleClip_khatam)">
    <!-- Top-Left Sweeping Light Facet (Ecclesia Signature Style) -->
    <path d="M 120 50 L 520 50 C 440 220 280 380 120 460 Z" fill="url(#glossTL_khatam)" />
    <!-- Secondary Geometric Facet -->
    <path d="M 150 50 L 650 50 L 650 220 C 480 240 310 350 150 550 Z" fill="#2DD4BF" fill-opacity="0.08" />
    <!-- Bottom-Right Deep Contrast Curve -->
    <path d="M 650 180 C 520 340 380 460 180 550 L 650 550 Z" fill="url(#SombraBR_khatam)" />
  </g>
  <!-- Outer & Inner Precision Bevel Borders -->
  <rect x="153" y="53" width="494" height="494" rx="112" fill="none" stroke="url(#rimGrad_khatam)" stroke-width="5" />
  <rect x="166" y="66" width="468" height="468" rx="102" fill="none" stroke="#99F6E4" stroke-width="1.5" stroke-opacity="0.25" />
  <g transform="translate(400, 300) translate(0, -42) scale(0.80) translate(-400, -300)">
  <g transform="translate(400, 295)" filter="url(#iconShadow_khatam)">
    <!-- Padlock Top Shackle -->
    <path d="M -52 -88 L -52 -125 C -52 -168 52 -168 52 -125 L 52 -88" fill="none" stroke="url(#whiteGrad_khatam)" stroke-width="22" stroke-linecap="round" />
    <path d="M -32 -88 L -32 -125 C -32 -148 32 -148 32 -125 L 32 -88" fill="none" stroke="#99F6E4" stroke-width="4" stroke-opacity="0.6" stroke-linecap="round" />

    <!-- Shield Body -->
    <path d="M 0 -105 L 110 -68 L 110 25 C 110 102 48 152 0 175 C -48 152 -110 102 -110 25 L -110 -68 Z" fill="url(#darkCore_khatam)" stroke="url(#whiteGrad_khatam)" stroke-width="16" stroke-linejoin="round" />

    <!-- Inner Shield Facet Panels (Top) -->
    <path d="M -82 -50 L -8 -76 L -8 -28 L -82 -28 Z" fill="url(#mintGrad_khatam)" fill-opacity="0.85" />
    <path d="M 82 -50 L 8 -76 L 8 -28 L 82 -28 Z" fill="#10B981" fill-opacity="0.65" />

    <!-- Bottom Shield Cryptographic Honeycomb / Hexagonal JWT Mesh -->
    <g stroke="#2DD4BF" stroke-width="2.8" fill="#0D9488" fill-opacity="0.25" opacity="0.9">
      <!-- Center Hexagons -->
      <polygon points="0,35 18,45 18,65 0,75 -18,65 -18,45" />
      <polygon points="36,35 54,45 54,65 36,75 18,65 18,45" />
      <polygon points="-36,35 -18,45 -18,65 -36,75 -54,65 -54,45" />
      <polygon points="18,65 36,75 36,95 18,105 0,95 0,75" />
      <polygon points="-18,65 0,75 0,95 -18,105 -36,95 -36,75" />
      <polygon points="0,95 18,105 18,125 0,135 -18,125 -18,105" />
      <!-- Node Dots -->
      <circle cx="0" cy="55" r="4" fill="#99F6E4" stroke="none" />
      <circle cx="-18" cy="85" r="4" fill="#99F6E4" stroke="none" />
      <circle cx="18" cy="85" r="4" fill="#99F6E4" stroke="none" />
      <circle cx="0" cy="115" r="4" fill="#99F6E4" stroke="none" />
    </g>

    <!-- Ornate Horizontal Master Key (Cutting Across Shield) -->
    <g transform="translate(0, 2)">
      <!-- Key Backing Shadow -->
      <rect x="-85" y="-16" width="245" height="32" rx="10" fill="#021716" fill-opacity="0.45" />
      <!-- Key Shaft -->
      <path d="M -70 -10 L 155 -10 C 163 -10 168 -5 168 0 C 168 5 163 10 155 10 L -70 10 Z" fill="url(#whiteGrad_khatam)" />
      <!-- Key Groove Line -->
      <line x1="-55" y1="0" x2="145" y2="0" stroke="#0D9488" stroke-width="3.5" stroke-linecap="round" />
      <!-- Key Collar -->
      <rect x="-68" y="-18" width="14" height="36" rx="5" fill="#99F6E4" />
      <!-- Key Teeth / Bit (Right Side) -->
      <path d="M 95 10 L 95 46 L 116 46 L 116 26 L 128 26 L 128 46 L 148 46 L 148 10 Z" fill="url(#whiteGrad_khatam)" />
      <!-- Trefoil / Clover Ornate Key Bow (Left Side) -->
      <circle cx="-118" cy="-28" r="26" fill="url(#darkCore_khatam)" stroke="url(#whiteGrad_khatam)" stroke-width="14" />
      <circle cx="-118" cy="28" r="26" fill="url(#darkCore_khatam)" stroke="url(#whiteGrad_khatam)" stroke-width="14" />
      <circle cx="-154" cy="0" r="26" fill="url(#darkCore_khatam)" stroke="url(#whiteGrad_khatam)" stroke-width="14" />
      <circle cx="-112" cy="0" r="16" fill="#2DD4BF" />
      <circle cx="-112" cy="0" r="7" fill="#042F2E" />
    </g>
  </g>
  </g>
  <!-- Internal Badge Typography -->
  <g filter="url(#iconShadow_internal)">
    <text x="400" y="472" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="2.5">KHATAM</text>
    <text x="400" y="510" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#99F6E4" letter-spacing="5.5">AUTHENTICATE</text>
  </g>
</svg>