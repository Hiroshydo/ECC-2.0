<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 20 580 580" width="100%" height="100%">
  <defs>
    <!-- Main Squircle Background Gradient -->
    <linearGradient id="bgGrad_canaa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="35%" stop-color="#0D9488" />
      <stop offset="70%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Diagonal Glossy Facet Top-Left -->
    <linearGradient id="glossTL_canaa" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.0" />
    </linearGradient>

    <!-- Diagonal Deep Shadow Bottom-Right -->
    <linearGradient id="SombraBR_canaa" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#021716" stop-opacity="0.55" />
    </linearGradient>

    <!-- Inner Bevel Border Gradient -->
    <linearGradient id="rimGrad_canaa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Mint-Emerald Gradient for Icon Highlights -->
    <linearGradient id="mintGrad_canaa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Dark Emerald Core Fill -->
    <linearGradient id="darkCore_canaa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Crisp Metallic White Gradient -->
    <linearGradient id="whiteGrad_canaa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Soft Drop Shadow for Squircle Badge -->
    <filter id="badgeShadow_canaa" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#042F2E" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>

    <!-- Crisp Inner Icon Drop Shadow -->
    <filter id="iconShadow_canaa" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#021716" flood-opacity="0.45" />
    </filter>

    <!-- Clip Path for Squircle Facets -->
    <clipPath id="squircleClip_canaa">
      <rect x="150" y="50" width="500" height="500" rx="115" />
    </clipPath>
  </defs>
  <!-- Squircle Base with 3D Facets & Gloss -->
  <g filter="url(#badgeShadow_canaa)">
    <rect x="150" y="50" width="500" height="500" rx="115" fill="url(#bgGrad_canaa)" />
  </g>
  <g clip-path="url(#squircleClip_canaa)">
    <!-- Top-Left Sweeping Light Facet (Ecclesia Signature Style) -->
    <path d="M 120 50 L 520 50 C 440 220 280 380 120 460 Z" fill="url(#glossTL_canaa)" />
    <!-- Secondary Geometric Facet -->
    <path d="M 150 50 L 650 50 L 650 220 C 480 240 310 350 150 550 Z" fill="#2DD4BF" fill-opacity="0.08" />
    <!-- Bottom-Right Deep Contrast Curve -->
    <path d="M 650 180 C 520 340 380 460 180 550 L 650 550 Z" fill="url(#SombraBR_canaa)" />
  </g>
  <!-- Outer & Inner Precision Bevel Borders -->
  <rect x="153" y="53" width="494" height="494" rx="112" fill="none" stroke="url(#rimGrad_canaa)" stroke-width="5" />
  <rect x="166" y="66" width="468" height="468" rx="102" fill="none" stroke="#99F6E4" stroke-width="1.5" stroke-opacity="0.25" />
  <g transform="translate(400, 300) scale(1.04) translate(-400, -280)">
  <g transform="translate(400, 295)" filter="url(#iconShadow_canaa)">
    <!-- Arching Gateway Portal (O Portal de Canaã) -->
    <path d="M -25 -75 L -25 -95 C -25 -155 115 -155 115 -75 L 115 135 L 135 135 M 85 135 L 85 -75 C 85 -118 5 -118 5 -75" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Portal Pillar Base -->
    <line x1="65" y1="138" x2="142" y2="138" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" />
    <!-- Inner Portal Glow Arch -->
    <path d="M -8 -75 C -8 -135 98 -135 98 -75 L 98 125" fill="none" stroke="#99F6E4" stroke-width="5" stroke-opacity="0.7" stroke-linecap="round" />

    <!-- Identity & Access Console Monitor / Card -->
    <g transform="translate(-38, 12)">
      <!-- Monitor Outer Frame -->
      <rect x="-112" y="-82" width="184" height="142" rx="20" fill="url(#darkCore_canaa)" stroke="#FFFFFF" stroke-width="12" />
      <!-- Monitor Stand Base -->
      <line x1="-42" y1="82" x2="2" y2="82" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

      <!-- User Profile Avatar (Left Side) -->
      <circle cx="-62" cy="-35" r="18" fill="#FFFFFF" />
      <path d="M -92 14 C -92 -6 -32 -6 -32 14 Z" fill="#FFFFFF" />

      <!-- Credential Lines Below Avatar -->
      <line x1="-92" y1="30" x2="-15" y2="30" stroke="#99F6E4" stroke-width="7" stroke-linecap="round" />
      <line x1="-92" y1="44" x2="-42" y2="44" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />

      <!-- Biometric / Smart Card Security Chip (Center) -->
      <g transform="translate(-14, -36)">
        <rect x="0" y="0" width="42" height="36" rx="6" fill="#FFFFFF" />
        <line x1="14" y1="0" x2="14" y2="36" stroke="#065F46" stroke-width="3" />
        <line x1="28" y1="0" x2="28" y2="36" stroke="#065F46" stroke-width="3" />
        <line x1="0" y1="12" x2="42" y2="12" stroke="#065F46" stroke-width="3" />
        <line x1="0" y1="24" x2="42" y2="24" stroke="#065F46" stroke-width="3" />
        <rect x="11" y="9" width="20" height="18" rx="3" fill="#99F6E4" stroke="#065F46" stroke-width="2.5" />
      </g>

      <!-- Access Key Icon (Right Side of Card) -->
      <g transform="translate(46, -24)">
        <circle cx="0" cy="0" r="14" fill="none" stroke="#2DD4BF" stroke-width="8" />
        <line x1="0" y1="14" x2="0" y2="54" stroke="#2DD4BF" stroke-width="8" stroke-linecap="round" />
        <line x1="0" y1="36" x2="12" y2="36" stroke="#2DD4BF" stroke-width="7" stroke-linecap="round" />
        <line x1="0" y1="48" x2="12" y2="48" stroke="#2DD4BF" stroke-width="7" stroke-linecap="round" />
      </g>
    </g>
  </g>
  </g>
</svg>