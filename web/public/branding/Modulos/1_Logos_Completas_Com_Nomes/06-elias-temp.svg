<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 820" width="100%" height="100%">
  <defs>
    <!-- Main Squircle Background Gradient -->
    <linearGradient id="bgGrad_elias" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="35%" stop-color="#0D9488" />
      <stop offset="70%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Diagonal Glossy Facet Top-Left -->
    <linearGradient id="glossTL_elias" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.0" />
    </linearGradient>

    <!-- Diagonal Deep Shadow Bottom-Right -->
    <linearGradient id="SombraBR_elias" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#021716" stop-opacity="0.55" />
    </linearGradient>

    <!-- Inner Bevel Border Gradient -->
    <linearGradient id="rimGrad_elias" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Mint-Emerald Gradient for Icon Highlights -->
    <linearGradient id="mintGrad_elias" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Dark Emerald Core Fill -->
    <linearGradient id="darkCore_elias" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Crisp Metallic White Gradient -->
    <linearGradient id="whiteGrad_elias" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Soft Drop Shadow for Squircle Badge -->
    <filter id="badgeShadow_elias" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#042F2E" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>

    <!-- Crisp Inner Icon Drop Shadow -->
    <filter id="iconShadow_elias" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#021716" flood-opacity="0.45" />
    </filter>

    <!-- Clip Path for Squircle Facets -->
    <clipPath id="squircleClip_elias">
      <rect x="150" y="50" width="500" height="500" rx="115" />
    </clipPath>
  </defs>
  <!-- Squircle Base with 3D Facets & Gloss -->
  <g filter="url(#badgeShadow_elias)">
    <rect x="150" y="50" width="500" height="500" rx="115" fill="url(#bgGrad_elias)" />
  </g>
  <g clip-path="url(#squircleClip_elias)">
    <!-- Top-Left Sweeping Light Facet (Ecclesia Signature Style) -->
    <path d="M 120 50 L 520 50 C 440 220 280 380 120 460 Z" fill="url(#glossTL_elias)" />
    <!-- Secondary Geometric Facet -->
    <path d="M 150 50 L 650 50 L 650 220 C 480 240 310 350 150 550 Z" fill="#2DD4BF" fill-opacity="0.08" />
    <!-- Bottom-Right Deep Contrast Curve -->
    <path d="M 650 180 C 520 340 380 460 180 550 L 650 550 Z" fill="url(#SombraBR_elias)" />
  </g>
  <!-- Outer & Inner Precision Bevel Borders -->
  <rect x="153" y="53" width="494" height="494" rx="112" fill="none" stroke="url(#rimGrad_elias)" stroke-width="5" />
  <rect x="166" y="66" width="468" height="468" rx="102" fill="none" stroke="#99F6E4" stroke-width="1.5" stroke-opacity="0.25" />
  <g transform="translate(400, 245)" filter="url(#iconShadow_elias)">
    <!-- Hourglass Top Cap -->
    <rect x="-85" y="-148" width="170" height="18" rx="9" fill="#FFFFFF" />
    <rect x="-72" y="-130" width="144" height="8" rx="4" fill="#99F6E4" />

    <!-- Hourglass Glass Bulbs (Upper & Lower) -->
    <path d="M -68 -122 C -68 -48 -14 -32 -14 0 C -14 32 -68 48 -68 122 L 68 122 C 68 48 14 32 14 0 C 14 -32 68 -48 68 -122 Z" fill="url(#darkCore_elias)" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" />

    <!-- Sand in Upper Bulb -->
    <path d="M -50 -92 C -20 -82 20 -82 50 -92 C 42 -52 10 -35 0 -14 C -10 -35 -42 -52 -50 -92 Z" fill="url(#whiteGrad_elias)" />
    <!-- Trickling Sand Stream -->
    <line x1="0" y1="-12" x2="0" y2="35" stroke="#99F6E4" stroke-width="6" stroke-dasharray="6,6" stroke-linecap="round" />

    <!-- Orbital Time-Lock Ring (Tranca da Linha do Tempo) -->
    <ellipse cx="0" cy="-15" rx="125" ry="42" transform="rotate(-24)" fill="none" stroke="url(#mintGrad_elias)" stroke-width="12" />
    <ellipse cx="0" cy="-15" rx="125" ry="42" transform="rotate(-24)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.6" />

    <!-- Monthly Competency Calendar Base (monthly_closings - Day 25) -->
    <g transform="translate(0, 78)">
      <!-- Calendar Outer Frame -->
      <rect x="-68" y="-38" width="136" height="92" rx="14" fill="url(#whiteGrad_elias)" stroke="#065F46" stroke-width="6" />
      <!-- Calendar Ring Tabs -->
      <rect x="-38" y="-48" width="10" height="20" rx="5" fill="#99F6E4" />
      <rect x="28" y="-48" width="10" height="20" rx="5" fill="#99F6E4" />
      <!-- Number '25' (Competência Encerrada) -->
      <text x="0" y="6" text-anchor="middle" font-family="'Montserrat', 'Inter', Arial, sans-serif" font-size="44" font-weight="900" fill="#042F2E">25</text>
      <!-- Mini Competency Grid Squares -->
      <g fill="#10B981">
        <!-- Left Column -->
        <rect x="-52" y="-20" width="14" height="10" rx="2" fill="#2DD4BF" />
        <rect x="-52" y="-4" width="14" height="10" rx="2" fill="#2DD4BF" />
        <!-- Right Column -->
        <rect x="38" y="-20" width="14" height="10" rx="2" fill="#99F6E4" />
        <rect x="38" y="-4" width="14" height="10" rx="2" fill="#99F6E4" />
        <!-- Bottom Row (5 Locked Days) -->
        <rect x="-52" y="16" width="16" height="12" rx="2" />
        <rect x="-30" y="16" width="16" height="12" rx="2" />
        <rect x="-8" y="16" width="16" height="12" rx="2" />
        <rect x="14" y="16" width="16" height="12" rx="2" />
        <rect x="36" y="16" width="16" height="12" rx="2" />
      </g>
    </g>

    <!-- Base Platform Bar -->
    <rect x="-92" y="130" width="184" height="18" rx="9" fill="#99F6E4" stroke="#042F2E" stroke-width="4" />
  </g>
  <!-- Official Module Typography -->
  <g>
    <text x="400" y="645" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="#0B3B35" letter-spacing="3">ELIAS</text>
    <text x="400" y="693" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#115E59" letter-spacing="7">TEMP</text>
    <line x1="220" y1="721" x2="580" y2="721" stroke="#0D9488" stroke-width="2" stroke-opacity="0.4" />
    <text x="400" y="751" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#0F766E" letter-spacing="4">O GUARDIÃO DO TEMPO E COMPETÊNCIAS</text>
  </g>
</svg>