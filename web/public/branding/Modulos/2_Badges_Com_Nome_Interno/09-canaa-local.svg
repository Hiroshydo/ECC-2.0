<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 20 580 580" width="100%" height="100%">
  <defs>
    <!-- Main Squircle Background Gradient -->
    <linearGradient id="bgGrad_local" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="35%" stop-color="#0D9488" />
      <stop offset="70%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Diagonal Glossy Facet Top-Left -->
    <linearGradient id="glossTL_local" x1="0%" y1="0%" x2="70%" y2="70%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.0" />
    </linearGradient>

    <!-- Diagonal Deep Shadow Bottom-Right -->
    <linearGradient id="SombraBR_local" x1="30%" y1="30%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042F2E" stop-opacity="0.0" />
      <stop offset="100%" stop-color="#021716" stop-opacity="0.55" />
    </linearGradient>

    <!-- Inner Bevel Border Gradient -->
    <linearGradient id="rimGrad_local" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#14B8A6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#022C22" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Mint-Emerald Gradient for Icon Highlights -->
    <linearGradient id="mintGrad_local" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99F6E4" />
      <stop offset="50%" stop-color="#2DD4BF" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>

    <!-- Dark Emerald Core Fill -->
    <linearGradient id="darkCore_local" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#042F2E" />
    </linearGradient>

    <!-- Crisp Metallic White Gradient -->
    <linearGradient id="whiteGrad_local" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <!-- Soft Drop Shadow for Squircle Badge -->
    <filter id="badgeShadow_local" x="-15%" y="-10%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#042F2E" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0D9488" flood-opacity="0.15" />
    </filter>

    <!-- Crisp Inner Icon Drop Shadow -->
    <filter id="iconShadow_local" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#021716" flood-opacity="0.45" />
    </filter>

    <!-- Clip Path for Squircle Facets -->
    <clipPath id="squircleClip_local">
      <rect x="150" y="50" width="500" height="500" rx="115" />
    </clipPath>
  </defs>
  <defs>
    <filter id="iconShadow_internal" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#021716" flood-opacity="0.5" />
    </filter>
  </defs>
  <!-- Squircle Base with 3D Facets & Gloss -->
  <g filter="url(#badgeShadow_local)">
    <rect x="150" y="50" width="500" height="500" rx="115" fill="url(#bgGrad_local)" />
  </g>
  <g clip-path="url(#squircleClip_local)">
    <!-- Top-Left Sweeping Light Facet (Ecclesia Signature Style) -->
    <path d="M 120 50 L 520 50 C 440 220 280 380 120 460 Z" fill="url(#glossTL_local)" />
    <!-- Secondary Geometric Facet -->
    <path d="M 150 50 L 650 50 L 650 220 C 480 240 310 350 150 550 Z" fill="#2DD4BF" fill-opacity="0.08" />
    <!-- Bottom-Right Deep Contrast Curve -->
    <path d="M 650 180 C 520 340 380 460 180 550 L 650 550 Z" fill="url(#SombraBR_local)" />
  </g>
  <!-- Outer & Inner Precision Bevel Borders -->
  <rect x="153" y="53" width="494" height="494" rx="112" fill="none" stroke="url(#rimGrad_local)" stroke-width="5" />
  <rect x="166" y="66" width="468" height="468" rx="102" fill="none" stroke="#99F6E4" stroke-width="1.5" stroke-opacity="0.25" />
  <g transform="translate(400, 300) translate(0, -40) scale(0.80) translate(-400, -300)">
  <g transform="translate(400, 295)" filter="url(#iconShadow_local)">
    <!-- Local Church / Congregation Architectural Silhouette -->
    <!-- Side Nave Wings -->
    <path d="M -135 -25 L -78 -58 L -78 95 M -115 -12 L -115 95" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 135 -25 L 78 -58 L 78 95 M 115 -12 L 115 95" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Central Sanctuary Pointed Arch Dome -->
    <path d="M -78 95 L -78 -55 C -78 -118 -25 -142 0 -168 C 25 -142 78 -118 78 -55 L 78 95" fill="url(#darkCore_local)" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Top Spire Finial -->
    <line x1="0" y1="-182" x2="0" y2="-165" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" />

    <!-- Pastoral Key Inside Upper Sanctuary Dome -->
    <g transform="translate(0, -102)">
      <circle cx="0" cy="0" r="15" fill="none" stroke="#99F6E4" stroke-width="8" />
      <line x1="0" y1="15" x2="0" y2="55" stroke="#99F6E4" stroke-width="8" stroke-linecap="round" />
      <line x1="0" y1="36" x2="12" y2="36" stroke="#99F6E4" stroke-width="7" stroke-linecap="round" />
      <line x1="0" y1="48" x2="10" y2="48" stroke="#99F6E4" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- Congregation / Local Team (3 People Figures) -->
    <!-- Left Team Member -->
    <circle cx="-46" cy="-2" r="16" fill="none" stroke="#FFFFFF" stroke-width="9" />
    <path d="M -76 85 C -76 42 -28 42 -28 72" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
    <!-- Right Team Member -->
    <circle cx="46" cy="-2" r="16" fill="none" stroke="#FFFFFF" stroke-width="9" />
    <path d="M 76 85 C 76 42 28 42 28 72" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" />
    <!-- Center Pastor / Local Gestor -->
    <circle cx="0" cy="-8" r="20" fill="none" stroke="#FFFFFF" stroke-width="11" />
    <path d="M -38 92 C -38 35 38 35 38 92" fill="url(#mintGrad_local)" fill-opacity="0.35" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />

    <!-- Ground Horizon Lines -->
    <line x1="-135" y1="98" x2="-32" y2="98" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />
    <line x1="32" y1="98" x2="135" y2="98" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" />

    <!-- Bottom Geolocation Map Pin (Unidade Local) -->
    <g transform="translate(0, 118)">
      <ellipse cx="0" cy="30" rx="32" ry="8" fill="none" stroke="#99F6E4" stroke-width="5" />
      <path d="M 0 26 C -18 4 -24 -8 -24 -20 A 24 24 0 1 1 24 -20 C 24 -8 18 4 0 26 Z" fill="url(#whiteGrad_local)" />
      <circle cx="0" cy="-20" r="9" fill="#042F2E" />
    </g>
  </g>
  </g>
  <!-- Internal Badge Typography -->
  <g filter="url(#iconShadow_internal)">
    <text x="400" y="472" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" letter-spacing="2.5">CANAÃ</text>
    <text x="400" y="510" text-anchor="middle" font-family="'Montserrat', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#99F6E4" letter-spacing="5.5">LOCAL</text>
  </g>
</svg>